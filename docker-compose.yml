
services:
  postgres:
    image: postgres:16
    container_name: payment-platform-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: dev-payment-password#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
